name: Deploy docs

on:
  push:
    branches: [main]   

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip' 

      - name: Install dependencies
        run: |
          pip install 'mkdocstrings[python]' mkdocs-material mkdocs-gen-files mkdocs-jupyter mkdocs-literate-nav 

      - name: Build documentation
        run: mkdocs build 

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4