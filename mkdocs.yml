site_name: scDesigner Project

theme:
  name: material

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_docs.py
  - mkdocstrings:
      handlers:
        python:
          paths: ["scdesigner/src"]
          options:
            docstring_style: numpy
            show_source: true
  - literate-nav:
      nav_file: SUMMARY.md
nav:
  - Home: index.md
  - API Reference: SUMMARY.md